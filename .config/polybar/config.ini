[colors]
background = #11111b
foreground = #cdd6f4
purple = #bd93f9
gray = #585b70

[bar/main]
width = 100%
height = 30
background = ${colors.background}
foreground = ${colors.foreground}

font-0 = JetBrainsMono Nerd Font:size=11;2

modules-left = bspwm
modules-center = date
modules-right = wlan battery

padding-left = 2
padding-right = 2
module-margin = 1

wm-restack = bspwm

[module/bspwm]
type = internal/bspwm

label-focused = %name%
label-focused-foreground = ${colors.purple}
label-focused-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.gray}
label-empty-padding = 1

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M

label = %date%

[module/wlan]
type = internal/network
interface = wlp3s0
interval = 3

label-connected = WiFi %essid%
label-disconnected = WiFi oFF

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
poll-interval = 5

format-charging = CHG <label-charging>
format-discharging = BAT <label-discharging>

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = BAT 100%



